name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python-${{ matrix.python }}${{ matrix.free_threading && 't' || '' }}
    runs-on: ubuntu-latest
    container: ghcr.io/rroblf01/vcraft-manylinux:1.7.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            interpreter: /opt/python/cp314-cp314/bin/python
            free_threading: false
          - python: "3.14"
            interpreter: /opt/python/cp314-cp314t/bin/python
            free_threading: true
          - python: "3.15"
            interpreter: /opt/python/cp315-cp315/bin/python
            free_threading: false
          - python: "3.15"
            interpreter: /opt/python/cp315-cp315t/bin/python
            free_threading: true
    steps:
      - uses: actions/checkout@v5

      - name: build and test
        working-directory: .
        env:
          VCRAFT_NO_MEMORY_LIMIT: 1
        run: |
          rm -rf vlambda/.venv
          ${{ matrix.interpreter }} -m venv vlambda/.venv
          . vlambda/.venv/bin/activate
          vcraft develop ${{ matrix.free_threading && '--free-threading' || '' }} --interpreter ${{ matrix.interpreter }}
          python tests/test_vlambda.py
