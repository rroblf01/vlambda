<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vlambda API docs</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --get:#3fb950; --post:#58a6ff; --put:#d29922; --delete:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px 32px; border-bottom:1px solid var(--border); background:var(--panel); }
  h1 { margin:0 0 4px; font-size:22px; }
  main { max-width:1100px; margin:0 auto; padding:24px 32px 60px; }
  .muted { color:var(--muted); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
  input { flex:1; min-width:220px; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:#0d1117; color:var(--fg); }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--border); background:#21262d; color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .op { border:1px solid var(--border); border-radius:8px; margin:10px 0; overflow:hidden; background:var(--panel); }
  .op summary { cursor:pointer; padding:10px 14px; display:flex; gap:10px; align-items:center; }
  .method { font-weight:700; font-family:ui-monospace,monospace; padding:2px 7px; border-radius:4px; color:#fff; background:#30363d; text-transform:uppercase; font-size:12px; }
  .method.get { background:var(--get); color:#04260f; }
  .method.post { background:var(--post); color:#04182b; }
  .method.put, .method.patch { background:var(--put); color:#2b1d00; }
  .method.delete { background:var(--delete); color:#fff; }
  .path { font-family:ui-monospace,monospace; color:var(--accent); }
  .body { padding:0 14px 14px; color:var(--muted); white-space:pre-wrap; }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:1px 8px; color:var(--muted); }
  .error { color:var(--delete); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>vlambda API</h1>
  <div class="muted">OpenAPI 3.1. Public invocation endpoints are under <code>/f/&lt;slug&gt;</code>.</div>
</header>
<main>
  <div class="bar">
    <input id="token" type="password" placeholder="Bearer token (leave empty if VLAMBDA_OPENAPI_PUBLIC=1)">
    <button onclick="loadSpec()">Load spec</button>
    <a href="/openapi.json" target="_blank" rel="noopener"><button type="button">Raw JSON</button></a>
  </div>
  <div id="status" class="muted">Enter a token and load the spec.</div>
  <div id="spec"></div>
</main>
<script>
const statusEl = document.getElementById('status');
const specEl = document.getElementById('spec');
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function loadSpec() {
  const token = document.getElementById('token').value.trim();
  statusEl.textContent = 'Loading…';
  statusEl.className = 'muted';
  specEl.innerHTML = '';
  try {
    const response = await fetch('/openapi.json', {
      headers: token ? {'Authorization': 'Bearer ' + token} : {},
    });
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!response.ok) throw new Error((data && data.error) || ('HTTP ' + response.status));
    if (!data || !data.paths) throw new Error('Invalid OpenAPI document');
    statusEl.textContent = (data.info && data.info.title || 'vlambda') + ' ' + (data.info && data.info.version || '') +
      ' · ' + Object.keys(data.paths).length + ' paths';
    const servers = (data.servers || []).map(s => s.url).join(', ');
    let html = servers ? '<p class="muted">Server: <span class="path">' + esc(servers) + '</span></p>' : '';
    for (const [path, methods] of Object.entries(data.paths)) {
      for (const [method, op] of Object.entries(methods)) {
        const tags = (op.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join(' ');
        html += '<details class="op"><summary>' +
          '<span class="method ' + esc(method) + '">' + esc(method) + '</span>' +
          '<span class="path">' + esc(path) + '</span>' +
          '<strong>' + esc(op.summary || '') + '</strong>' + tags +
          '</summary><div class="body">' + esc(op.description || '') +
          (op['x-vlambda-slug'] ? '\nSlug: ' + esc(op['x-vlambda-slug']) : '') + '</div></details>';
      }
    }
    specEl.innerHTML = html || '<p class="muted">No lambdas yet.</p>';
  } catch (error) {
    statusEl.textContent = error.message || String(error);
    statusEl.className = 'error';
  }
}
</script>
</body>
</html>
