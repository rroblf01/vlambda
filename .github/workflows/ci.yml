name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python-${{ matrix.python }}
    runs-on: ubuntu-latest
    container: ghcr.io/rroblf01/vcraft-manylinux:1.7.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            interpreter: /opt/python/cp314-cp314/bin/python
          - python: "3.15"
            interpreter: /opt/python/cp315-cp315/bin/python
    steps:
      - uses: actions/checkout@v5

      - name: build and test
        working-directory: vlambda
        env:
          VCRAFT_NO_MEMORY_LIMIT: 1
        run: |
          rm -rf .venv
          ${{ matrix.interpreter }} -m venv .venv
          . .venv/bin/activate
          vcraft develop
          python ../tests/test_vlambda.py
