name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      vlambda_version:
        description: "vlambda version to install from PyPI"
        required: false
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VLAMBDA_VERSION=${{ github.event.release.tag_name || inputs.vlambda_version }}
          tags: |
            ghcr.io/rroblf01/vlambda:latest
            ghcr.io/rroblf01/vlambda:${{ github.event.release.tag_name || inputs.vlambda_version }}
