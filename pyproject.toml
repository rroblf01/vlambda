[project]
name = "vlambda"
version = "1.1.0"
authors = [{name = "Ricardo Robles Fernández"}]
license = {text = "MIT"}

[build-system]
requires = []
build-backend = "vcraft_build"
backend-path = ["."]

# A project keeps its Python package under `python/` (see the generated layout),
# so a type checker or editor is told where to look: without this, `import
# <name>` is unresolved in an editor until the package is installed.
[tool.pyright]
extraPaths = ["python"]

[tool.mypy]
mypy_path = "python"

[tool.ty.environment]
extra-paths = ["./python"]

[tool.setuptools.package-data]
vlambda = ["ui.html", "favicon.ico"]

[tool.coverage.run]
source = ["python/vlambda"]
omit = [
    "python/vlambda/__main__.py",
    "python/vlambda/assets.py",
    "python/vlambda/forkd.py",
]

[tool.coverage.report]
fail_under = 55
skip_covered = true
