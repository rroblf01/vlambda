name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "cp314-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.0"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314/bin/python"
            check: "/opt/python/cp314-cp314/bin/python"
          - target: "cp314-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.0"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314/bin/python"
            check: "/opt/python/cp314-cp314/bin/python"
          - target: "cp315-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.0"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315/bin/python"
            check: "/opt/python/cp315-cp315/bin/python"
          - target: "cp315-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.0"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315/bin/python"
            check: "/opt/python/cp315-cp315/bin/python"
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        id: python
        if: ${{ matrix.container == '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: build
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          container: ${{ matrix.container }}
          working-directory: vlambda
          args: ${{ matrix.args }}

      - name: the wheel was written
        working-directory: vlambda
        shell: bash
        run: |
          ls -la dist || true
          ls dist/*.whl >/dev/null 2>&1 || { echo 'no wheel was written in dist/'; exit 1; }

      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: vlambda/dist/*.whl

      - name: test (POSIX)
        if: ${{ runner.os != 'Windows' && matrix.check != '' }}
        working-directory: vlambda
        env:
          CONTAINER: ${{ matrix.container }}
          CHECK: ${{ matrix.check }}
        run: |
          script="$CHECK -m venv /tmp/check && /tmp/check/bin/python -m pip install dist/*.whl && /tmp/check/bin/python -c 'import vlambda_native; print(vlambda_native.__name__)'"
          if [ -n "$CONTAINER" ]; then
            docker run --rm -e CHECK -v "$PWD:/work" -w /work "$CONTAINER" sh -c "$script"
          else
            sh -c "$script"
          fi
      - name: test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          CHECK: ${{ steps.python.outputs.python-path }}
        run: |
          & "$env:CHECK" -m venv "$env:RUNNER_TEMP\check"
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -m pip install (Get-ChildItem dist/*.whl).FullName
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -c "import vlambda_native; print(vlambda_native.__name__)"

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: install vcraft
        run: python -m pip install "vcraft==1.7.0"

      - name: build the sdist
        run: |
          cd vlambda
          python -m venv .venv
          . .venv/bin/activate
          pip install "vcraft==1.7.0"
          vcraft sdist
          python - <<'PY'
          import glob, gzip, io, tarfile
          src = glob.glob("dist/*.tar.gz")[0]
          dst = src + ".pax"
          with tarfile.open(src, "r:gz") as tin:
              with tarfile.open(dst, "w:gz", format=tarfile.PAX_FORMAT) as tout:
                  for m in tin.getmembers():
                      f = tin.extractfile(m)
                      data = f.read() if f is not None else None
                      tout.addfile(m, io.BytesIO(data) if data is not None else None)
          import os
          os.replace(dst, src)
          PY

      - name: upload the sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: vlambda/dist/*.tar.gz

  verify:
    name: verify the artifacts
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: check files present
        run: ls -la dist

  publish:
    name: publish to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vlambda
    permissions:
      id-token: write
    steps:
      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
