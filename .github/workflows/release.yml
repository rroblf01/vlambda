name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          value="${{ inputs.version }}"
          if [ -z "$value" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              value="${GITHUB_REF_NAME#v}"
            else
              value=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
            fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: check version
        shell: bash
        run: |
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "${{ steps.version.outputs.value }}" != "$py" ]; then
            echo "resolved version ${{ steps.version.outputs.value }} does not match pyproject.toml ($py)" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "cp314-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314/bin/python"
            check: "/opt/python/cp314-cp314/bin/python"
          - target: "cp314-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314/bin/python"
            check: "/opt/python/cp314-cp314/bin/python"
          - target: "cp314t-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314t/bin/python --free-threading"
            check: "/opt/python/cp314-cp314t/bin/python"
          - target: "cp314t-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp314-cp314t/bin/python --free-threading"
            check: "/opt/python/cp314-cp314t/bin/python"
          - target: "cp315-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315/bin/python"
            check: "/opt/python/cp315-cp315/bin/python"
          - target: "cp315-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315/bin/python"
            check: "/opt/python/cp315-cp315/bin/python"
          - target: "cp315t-linux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315t/bin/python --free-threading"
            check: "/opt/python/cp315-cp315t/bin/python"
          - target: "cp315t-linux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.7.2"
            args: "build --release --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp315-cp315t/bin/python --free-threading"
            check: "/opt/python/cp315-cp315t/bin/python"
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        id: python
        if: ${{ matrix.container == '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: build
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          container: ${{ matrix.container }}
          args: ${{ matrix.args }}

      - name: the wheel was written
        shell: bash
        run: |
          ls -la dist || true
          ls dist/*.whl >/dev/null 2>&1 || { echo 'no wheel was written in dist/'; exit 1; }

      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.whl

      - name: test (POSIX)
        if: ${{ runner.os != 'Windows' && matrix.check != '' }}
        env:
          CONTAINER: ${{ matrix.container }}
          CHECK: ${{ matrix.check }}
        run: |
          script="$CHECK -m venv /tmp/check && /tmp/check/bin/python -m pip install dist/*.whl && /tmp/check/bin/python -c 'import vlambda_native; print(vlambda_native.__name__)'"
          if [ -n "$CONTAINER" ]; then
            docker run --rm -e CHECK -v "$PWD:/work" -w /work "$CONTAINER" sh -c "$script"
          else
            sh -c "$script"
          fi
      - name: test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          CHECK: ${{ steps.python.outputs.python-path }}
        run: |
          & "$env:CHECK" -m venv "$env:RUNNER_TEMP\check"
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -m pip install (Get-ChildItem dist/*.whl).FullName
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -c "import vlambda_native; print(vlambda_native.__name__)"

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: install vcraft
        run: python -m pip install "vcraft==1.7.2"

      - name: build the sdist
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "vcraft==1.7.2"
          vcraft sdist

      - name: upload the sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  verify:
    name: verify the artifacts
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: check files present
        run: ls -la dist

  # Provenance in its own job, on a plain runner: it runs next to `publish`
  # rather than in front of it, so a change on GitHub's side cannot stop the
  # files from reaching PyPI, but a failure still marks the workflow red.
  attest:
    name: attest the build provenance
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vlambda
    permissions:
      id-token: write
    steps:
      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  image:
    name: publish container image
    needs: [publish, attest, version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.value }}
