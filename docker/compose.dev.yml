services:
  vlambda:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    image: vlambda:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - vlambda-dev-data:/data
    environment:
      VLAMBDA_SECRET: ${VLAMBDA_SECRET:-dev-secret}
      VLAMBDA_ADMIN_TOKEN: ${VLAMBDA_ADMIN_TOKEN:-dev-admin}
      VLAMBDA_MAX_LAMBDAS: ${VLAMBDA_MAX_LAMBDAS:-20}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m

volumes:
  vlambda-dev-data:
