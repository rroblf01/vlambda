[package]
name = "vlambda"
version = "0.1.0"
module = "vlambda_native"
description = "An ASGI-like server for Python lambdas, written in V."
license = "MIT"
requires-python = ">=3.15"
readme = "README.md"
classifiers = ["Programming Language :: Other", "Programming Language :: Python :: 3", "Programming Language :: Python :: Implementation :: CPython"]

[build]
minimum-version = "3.15"
