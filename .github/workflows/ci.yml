name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: build vlambda
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          args: develop
          working-directory: vlambda
          vcraft-version: v1.7.0

      - name: run tests
        run: |
          cd vlambda
          . .venv/bin/activate
          python ../tests/test_vlambda.py
