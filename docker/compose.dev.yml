services:
  vlambda:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    image: vlambda:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - vlambda-dev-data:/data
    environment:
      VLAMBDA_SECRET: ${VLAMBDA_SECRET:-dev-secret}
      VLAMBDA_ADMIN_TOKEN: ${VLAMBDA_ADMIN_TOKEN:-dev-admin}
      VLAMBDA_MAX_LAMBDAS: ${VLAMBDA_MAX_LAMBDAS:-20}
      VLAMBDA_REGISTRATION: ${VLAMBDA_REGISTRATION:-1}
      VLAMBDA_ISOLATE: ${VLAMBDA_ISOLATE:-1}
      VLAMBDA_NSJAIL: ${VLAMBDA_NSJAIL:-1}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
      # nsjail needs unprivileged user namespaces; its own seccomp policy
      # filters the sandboxed process.
      - seccomp=unconfined
    cap_drop:
      - ALL

volumes:
  vlambda-dev-data:
