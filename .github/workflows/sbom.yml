name: sbom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: vlambda-sbom.cdx.json
          artifact-name: vlambda-sbom.cdx.json

      - name: scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: upload vulnerability report
        uses: actions/upload-artifact@v6
        with:
          name: trivy-sarif
          path: trivy.sarif
