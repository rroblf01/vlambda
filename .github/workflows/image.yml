name: image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: vlambda version published on PyPI (without the leading v)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: wait for PyPI
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/vlambda/${{ steps.version.outputs.value }}/json" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "vlambda ${{ steps.version.outputs.value }} is not on PyPI yet" >&2
          exit 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VLAMBDA_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
