name: image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: vlambda version published on PyPI (without the leading v)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: wait for PyPI
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/vlambda/${{ inputs.version }}/json" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "vlambda ${{ inputs.version }} is not on PyPI yet" >&2
          exit 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VLAMBDA_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
