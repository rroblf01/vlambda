services:
  vlambda:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VLAMBDA_VERSION: ${VLAMBDA_VERSION:-0.2.1}
    image: ghcr.io/rroblf01/vlambda:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - vlambda-data:/data
    environment:
      VLAMBDA_SECRET: ${VLAMBDA_SECRET:?set VLAMBDA_SECRET}
      VLAMBDA_ADMIN_TOKEN: ${VLAMBDA_ADMIN_TOKEN:?set VLAMBDA_ADMIN_TOKEN}
      VLAMBDA_MAX_LAMBDAS: ${VLAMBDA_MAX_LAMBDAS:-20}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vlambda-data:
